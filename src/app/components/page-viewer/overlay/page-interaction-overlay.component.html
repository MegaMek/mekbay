@if (turnTrackerVisible() && dirtyPhase()) {
<div class="phase-controls">
    <button role="button" class="phase-button end-phase-button preventZoomReset" tabindex="0"
        (click)="endPhase($event)">
        COMMIT AND END PHASE
    </button>
</div>
}

@if (turnTrackerVisible()) {
<div class="container">
    <div class="top-right-controls">
        <unit-notification-badges
            [unit]="unit()"
            display="overlay"
            [interactive]="true"
            (activated)="openNotification($event)" />
        <button role="button" class="overlay-button overlay-round-button inventory-dialog-button preventZoomReset" tabindex="0" aria-label="Weapons and equipment" title="Weapons & Equipment" (click)="openWeaponEquipmentDialog($event)">
            <svg aria-hidden="true" fill="currentColor" width="24px" height="24px" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><circle cx="256" cy="256" r="48"/><path d="M223.47,335.59l-51.71,68a169.73,169.73,0,0,0,168.48,0l-51.71-68" style="fill:none"/><path d="M403.08,108.92A208,208,0,0,0,108.92,403.08,208,208,0,0,0,403.08,108.92ZM342,256a86.13,86.13,0,0,1-53.47,79.59l51.71,68a169.73,169.73,0,0,1-168.48,0l51.71-68a86,86,0,0,1-50.56-101.77l-85.48.09a170.21,170.21,0,0,1,73.83-119L199.2,191.5a85.78,85.78,0,0,1,113.6,0l37.94-76.59a170.21,170.21,0,0,1,73.83,119l-85.48-.09A85.87,85.87,0,0,1,342,256Z"/></svg>
        </button>
        <button role="button" class="overlay-button overlay-round-button targets-button preventZoomReset" tabindex="0" aria-label="Targets" title="Targets" (click)="openTargets($event)">
            <svg aria-hidden="true" stroke="currentColor" stroke-width="1.5" fill="none" height="24px" width="24px" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 1v5M12 18v5M1 12h5M18 12h5"></path></svg>
        </button>
        <button role="button" class="turn-tracker-button preventZoomReset" tabindex="0"
            (click)="openTurnSummary($event)">
            @let movement = movementIndicator();
            <svg [class.stationary]="movement?.color === 'stationary'" [class.walk]="movement?.color === 'walk'"
                [class.run]="movement?.color === 'run'" [class.jump]="movement?.color === 'jump'"
                [class.sprint]="movement?.color === 'sprint'" width="40px" height="40px" viewBox="0 0 32 32"
                xmlns="http://www.w3.org/2000/svg">
                <path class="octagon"
                    d="M30.8508,15.4487,23.8867,3.5322A1.0687,1.0687,0,0,0,22.9643,3H9.0357a1.0687,1.0687,0,0,0-.9224.5322L1.1492,15.4487a1.0933,1.0933,0,0,0,0,1.1026L8.1133,28.4678A1.0687,1.0687,0,0,0,9.0357,29H22.9643a1.0687,1.0687,0,0,0,.9224-.5322l6.9641-11.9165A1.0933,1.0933,0,0,0,30.8508,15.4487Z" />
                <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" font-size="18">
                    {{ movement?.letter ?? 'M' }}
                </text>
            </svg>
        </button>
    </div>
</div>
}
