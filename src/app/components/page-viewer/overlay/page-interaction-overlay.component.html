@if (turnTrackerVisible() && dirtyPhase()) {
<div class="phase-controls">
    <button role="button" class="phase-button end-phase-button preventZoomReset" tabindex="0"
        (click)="endPhase($event)">
        <svg class="end-phase-icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M4 12l5 5L20 6" />
        </svg>
        END PHASE
    </button>
</div>
}

@if (turnTrackerVisible()) {
<div class="container">
    <div class="top-right-controls">
        <unit-notification-badges
            [snapshot]="turn()"
            display="overlay"
            [interactive]="true"
            (activated)="openNotification($event)" />
        <button role="button" class="overlay-button overlay-round-button preventZoomReset" tabindex="0"
            [attr.aria-label]="unitViewMode.mode() === 'sheet' ? 'Open tactical view' : 'Open sheet view'"
            [title]="unitViewMode.mode() === 'sheet' ? 'Tactical View' : 'Sheet View'"
            (click)="toggleUnitView($event)">
            @if (unitViewMode.mode() === 'sheet') {
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path d="M4 5h7v6H4zM13 5h7v4h-7zM4 13h7v6H4zM13 11h7v8h-7z" />
            </svg>
            } @else {
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path d="M6 3h9l3 3v15H6z" />
                <path d="M15 3v4h4M9 11h6M9 15h6M9 18h4" />
            </svg>
            }
        </button>
        <button role="button" class="overlay-button overlay-round-button inventory-dialog-button preventZoomReset" tabindex="0" aria-label="Weapons and equipment" title="Weapons & Equipment" (click)="openWeaponEquipmentDialog($event)">
            <svg aria-hidden="true" fill="currentColor" width="24px" height="24px" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><circle cx="256" cy="256" r="48"/><path d="M223.47,335.59l-51.71,68a169.73,169.73,0,0,0,168.48,0l-51.71-68" style="fill:none"/><path d="M403.08,108.92A208,208,0,0,0,108.92,403.08,208,208,0,0,0,403.08,108.92ZM342,256a86.13,86.13,0,0,1-53.47,79.59l51.71,68a169.73,169.73,0,0,1-168.48,0l51.71-68a86,86,0,0,1-50.56-101.77l-85.48.09a170.21,170.21,0,0,1,73.83-119L199.2,191.5a85.78,85.78,0,0,1,113.6,0l37.94-76.59a170.21,170.21,0,0,1,73.83,119l-85.48-.09A85.87,85.87,0,0,1,342,256Z"/></svg>
        </button>
        <button role="button" class="overlay-button overlay-round-button preventZoomReset" tabindex="0" aria-label="Undo runtime action" title="Undo" [disabled]="!canUndo()" (click)="undoRuntimeCommand($event)">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M4 12h9a7 7 0 0 1 7 7"/></svg>
        </button>
        <button role="button" class="overlay-button overlay-round-button preventZoomReset" tabindex="0" aria-label="Redo runtime action" title="Redo" [disabled]="!canRedo()" (click)="redoRuntimeCommand($event)">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m15 7 5 5-5 5"/><path d="M20 12h-9a7 7 0 0 0-7 7"/></svg>
        </button>
        <button role="button" class="overlay-button overlay-round-button preventZoomReset" tabindex="0" aria-label="Runtime history" title="Runtime History" (click)="openRuntimeHistory($event)">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/><path d="M12 7v5l3 2"/></svg>
        </button>
        @if (supportsTargeting()) {
        <button role="button" class="overlay-button overlay-round-button targets-button preventZoomReset" tabindex="0" aria-label="Targets" title="Targets" (click)="openTargets($event)">
            <svg aria-hidden="true" stroke="currentColor" stroke-width="1.5" fill="none" height="24px" width="24px" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 1v5M12 18v5M1 12h5M18 12h5"></path></svg>
        </button>
        }
        @if (supportsTurnTracker()) {
        <button role="button" class="overlay-button turn-tracker-button preventZoomReset" tabindex="0"
            (click)="openTurnSummary($event)">
            @let phase = currentPhase();
            @let movement = movementIndicator();
            <svg [class.dirty]="dirty()" [class.move]="phase === 'M'" [class.ranged]="phase === 'W'" [class.physical]="phase === 'P'"
                [class.heat]="phase === 'H'" fill="currentColor" width="40px" height="40px" viewBox="0 0 32 32"
                [class.stationary]="movement?.color === 'stationary'" [class.walk]="movement?.color === 'walk'"
                [class.run]="movement?.color === 'run'" [class.jump]="movement?.color === 'jump'"
                [class.sprint]="movement?.color === 'sprint'"
                xmlns="http://www.w3.org/2000/svg">
                <path class="octagon"
                    d="M30.8508,15.4487,23.8867,3.5322A1.0687,1.0687,0,0,0,22.9643,3H9.0357a1.0687,1.0687,0,0,0-.9224.5322L1.1492,15.4487a1.0933,1.0933,0,0,0,0,1.1026L8.1133,28.4678A1.0687,1.0687,0,0,0,9.0357,29H22.9643a1.0687,1.0687,0,0,0,.9224-.5322l6.9641-11.9165A1.0933,1.0933,0,0,0,30.8508,15.4487Z" />
                <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" font-size="16">
                    {{ movement?.letter ?? phase }}
                </text>
            </svg>
        </button>
        }
    </div>
</div>
}
