<svg class="standard-layout-svg" viewBox="0 0 1120 800" width="1120" height="800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient [attr.id]="svgId + '-title'">
            <stop offset="0" stop-color="#5b504e" stop-opacity="0" />
            <stop offset="0.1" stop-color="#5b504e" />
            <stop offset="0.9" stop-color="#5b504e" />
            <stop offset="1" stop-color="#5b504e" stop-opacity="0" />
        </linearGradient>
        <linearGradient [attr.id]="svgId + '-damage'">
            <stop offset="0" stop-color="#5b504e" stop-opacity="0" />
            <stop [attr.offset]="hasExtremeRange() ? '0.025' : '0.065'" stop-color="#5b504e" />
            <stop [attr.offset]="hasExtremeRange() ? '0.975' : '0.935'" stop-color="#5b504e" />
            <stop offset="1" stop-color="#5b504e" stop-opacity="0" />
        </linearGradient>
        <clipPath [attr.id]="svgId + '-heat-clip'">
            <rect x="0" y="0" [attr.width]="heatTrackWidth()" height="50.74" rx="13.44" />
        </clipPath>
    </defs>
    @if (imageUrl() && !imageLoadFailed()) {
        <image class="fluff-image" x="639.968" [attr.y]="verticallyCenterImage() ? 144 : 112"
            width="408.8" [attr.height]="reducedHeightImage() ? 280 : 470"
            [attr.preserveAspectRatio]="verticallyCenterImage() ? 'xMidYMid meet' : 'xMidYMin meet'"
            [attr.href]="imageUrl()" (error)="onImageError()" />
    }
    <g class="era-icons">
        @for (item of eraAvailability(); track item.era.id) {
            @if (item.era.icon) {
                <image class="era-icon" x="1061.76" [attr.y]="145.6 + $index * 33.6" width="33.6" height="33.6"
                    [attr.href]="item.era.icon" [class.unavailable]="!item.isAvailable"><title>{{ item.era.name }}</title></image>
            }
        }
    </g>
    <g class="header-section">
        @if (isCommander()) {
            <svg class="group-commander-indicator" x="31.36" y="31.36" width="94.08" height="115.99" viewBox="0 0 21.04 25.94" aria-hidden="true">
                <g transform="rotate(180 10.52 12.97) translate(-.02)"><g transform="matrix(.265 0 0 .265 -21.1 0)">
                    <path d="m79.7 70 39.3-70 40 70.1h-27l-13-22.1-13 22.1z" /><path d="m81.4 97.9 11.3-21.6h52.3l12 21.6z" />
                </g></g>
            </svg>
        }
        <text class="model-text" x="31.36" [attr.y]="modelBaseline()" [attr.font-size]="modelSize()" [attr.textLength]="modelTextWidth()" lengthAdjust="spacingAndGlyphs">{{ modelLabel() }}</text>
        @if (unit().isCustom) {
            <g [attr.transform]="'translate(' + customBadgeX() + ' ' + customBadgeTop(modelBaseline(), '400 ' + modelSize() + 'px Roboto') + ')'">
                <rect class="custom-badge-frame" x=".56" y=".56" [attr.width]="customBadge().width - 1.12" [attr.height]="customBadge().height - 1.12" />
                <text class="custom-badge-text" x="14" [attr.y]="customBadge().baseline">CUSTOM</text>
            </g>
        }
        <text class="chassis-text" x="31.36" [attr.y]="chassisBaseline()" [attr.font-size]="chassisSize()"
            [attr.textLength]="chassisTextWidth()" lengthAdjust="spacingAndGlyphs">{{ chassisLabel() | uppercase }}</text>
        <path class="pv-background" d="M857.584 16.016 H1103.984 V100.016 H902.384 Z" />
        <text class="pv-text" x="1004.64" [attr.y]="20.8 + textBaseline('900 60.48px Roboto', 72.576)" text-anchor="middle">{{ adjustedPV() }}</text>
        @if (basePV() !== adjustedPV()) {
            <text class="base-pv-text" x="1004.64" [attr.y]="106.816 + textBaseline('700 26.88px Roboto', 32.256)" text-anchor="middle">Base PV: {{ basePV() }}</text>
        }
    </g>
    <g class="stats-container">
        <g class="stats-box" [attr.transform]="'translate(28 ' + statsY() + ')'">
            <rect class="frame-background" x="1.68" y="1.68" [attr.width]="leftWidth - 3.36" [attr.height]="statsHeight() - 3.36" rx="17.92" />
            @for (item of statItems(); track item.caption) {
                <text [attr.x]="item.x" [attr.y]="7.84 + item.y + textBaseline(bodyFont, bodyLine)">
                    <tspan class="as-caption">{{ item.caption }}</tspan><tspan class="as-value" dx="5.04">@for (part of movementParts(item.value); track $index) {<tspan [attr.font-size]="part === '⬢' ? '80%' : null" [attr.baseline-shift]="part === '⬢' ? '30%' : null">{{ part }}</tspan>}</tspan>
                </text>
            }
            @if (sprintMove(); as sprint) {
                <text class="sprint-text" [attr.x]="leftWidth - padding" [attr.y]="7.84 + (statItems().at(-1)?.y ?? 0) + bodyLine + textBaseline('700 22.4px Roboto', 22.4)" text-anchor="end">Sprint: @for (part of movementParts(sprint); track $index) {<tspan [attr.font-size]="part === '⬢' ? '80%' : null" [attr.baseline-shift]="part === '⬢' ? '30%' : null">{{ part }}</tspan>}</text>
            }
            <text [attr.x]="padding" [attr.y]="statsHeight() - 7.84 - bodyLine + textBaseline(bodyFont, bodyLine)"><tspan class="as-caption">ROLE:</tspan><tspan class="as-value" dx="5.04">{{ unit().role }}</tspan></text>
            <text class="pilot-skill" [class.clickable]="interactive()" [attr.x]="leftWidth - padding" [attr.y]="statsHeight() - 7.84 - bodyLine + textBaseline(bodyFont, bodyLine)" text-anchor="end" (click)="interactive() && onEditPilotClick()"><tspan class="as-caption">SKILL:</tspan><tspan class="as-value" dx="5.04">{{ vacant() ? 'VACANT' : skill() }}</tspan></text>
        </g>
        <g class="damage-box" [attr.transform]="'translate(28 ' + damageY() + ')'">
            <rect class="frame-background" x="1.68" y="1.68" [attr.width]="leftWidth - 3.36" [attr.height]="damageHeight() - 3.36" rx="17.92" />
            <text class="damage-label" [attr.transform]="'translate(28.22 ' + damageHeight() / 2 + ') rotate(-90)'" text-anchor="middle" dominant-baseline="middle">DAMAGE</text>
            @if (cardStyle() !== 'default') {
                <rect x="79.36" y="7.84" [attr.width]="leftWidth - 79.36 - padding" height="27.56" [attr.fill]="'url(#' + svgId + '-damage)'" />
            }
            @for (range of damageRanges(); track range.key) {
                <text class="range-header" [attr.x]="range.center" [attr.y]="7.84 + textBaseline('700 22.4px Roboto', 27.56)" text-anchor="middle">{{ range.header }}</text>
                <text class="range-value" [class.reduced]="weaponHits() > 0" [attr.x]="range.center" [attr.y]="damageValueY() + textBaseline('700 44.8px Roboto', 40.32)" text-anchor="middle">{{ range.value }}</text>
                <text class="range-distance" [attr.x]="range.center" [attr.y]="damageValueY() + 40.32 + textBaseline('400 22.4px Roboto', 27.56)" text-anchor="middle">{{ range.distance }}</text>
            }
        </g>
        @if (asStats().usesOV) {
            <g class="heat-box" [attr.transform]="'translate(28 ' + heatY() + ')'">
                <rect class="frame-background" x="1.68" y="1.68" [attr.width]="leftWidth - 3.36" height="63.06" rx="17.92" />
                <text x="13.44" [attr.y]="(66.42 - bodyLine) / 2 + textBaseline(bodyFont, bodyLine)"><tspan class="as-caption">OV: </tspan><tspan class="as-value">{{ asStats().OV }}</tspan></text>
                @if (cardStyle() !== 'default') {
                    <rect [attr.x]="heatLabelX() - 120" y="13.99" width="240" height="38.44" [attr.fill]="'url(#' + svgId + '-title)'" />
                }
                <text class="heat-label" [attr.x]="heatLabelX()" [attr.y]="13.99 + textBaseline('700 32.032px Roboto', 38.44)" text-anchor="middle">HEAT SCALE</text>
                <g class="heat-track" [attr.transform]="'translate(' + heatTrackX() + ' 7.84)'">
                    <g [attr.clip-path]="'url(#' + svgId + '-heat-clip)'">
                        <rect x="0" y="0" [attr.width]="heatTrackWidth()" height="50.74" fill="#888" />
                        @for (level of heatSegments(); track level.level) {
                            <g class="heat-level" [attr.data-heat]="level.level" [class.active]="level.active" [class.pending]="level.pending" [class.heat-s]="level.shutdown" [attr.transform]="'translate(' + ($index * heatCellWidth() + 1.568) + ' 0)'">
                                <rect class="heat-level-fill" x="0" y="0" [attr.width]="heatCellWidth()" height="50.74" />
                                <text [attr.x]="heatCellWidth() / 2" [attr.y]="textBaseline('400 39.2px Roboto', 50.74)" text-anchor="middle">{{ level.label }}</text>
                                @if (!$last) {<line [attr.x1]="heatCellWidth()" y1="0" [attr.x2]="heatCellWidth()" y2="50.74" stroke="#000" stroke-width="2.352" />}
                            </g>
                        }
                    </g>
                    <rect class="heat-track-border" x="1.4" y="1.4" [attr.width]="heatTrackWidth() - 2.8" height="47.94" rx="12.04" />
                </g>
            </g>
        }
        <g class="armor-box" [attr.transform]="'translate(28 ' + armorY() + ')'">
            <rect class="frame-background" x="1.68" y="1.68" [attr.width]="leftWidth - 3.36" [attr.height]="armorHeight() - 3.36" rx="17.92" />
            <g class="pips-wrapper">
                <g class="pip-row" data-damage-type="armor">
                    <rect x="13.44" y="7.84" [attr.width]="leftWidth - 2 * padding - (asStats().usesTh ? 67.2 : 0)" [attr.height]="armorRowHeight()" fill="transparent" />
                    <text class="as-caption" x="13.44" [attr.y]="7.84 + (armorRowHeight() - bodyLine) / 2 + textBaseline(bodyFont, bodyLine)">A:</text>
                    @for (row of armorRows(); track $index; let rowIndex = $index) {
                        @for (pipState of row; track pipState.index) {
                            <svg class="pip" [attr.x]="52.64 + $index * 36.96" [attr.y]="7.84 + (armorRowHeight() - (armorRows().length * 36.96 - gap)) / 2 + rowIndex * 36.96" width="31.36" height="31.36" viewBox="0 0 24 24" [class.damaged]="pipState.isDamaged" [class.pending-damage]="pipState.isPendingDamage" [class.pending-heal]="pipState.isPendingHeal"><circle cx="12" cy="12" r="10" /></svg>
                        }
                    }
                </g>
                <g class="pip-row" data-damage-type="structure" [attr.transform]="'translate(0 ' + armorRowHeight() + ')'">
                    <rect x="13.44" y="7.84" [attr.width]="leftWidth - 2 * padding - (asStats().usesTh ? 67.2 : 0)" [attr.height]="structureRowHeight()" fill="transparent" />
                    <text class="as-caption" x="13.44" [attr.y]="7.84 + (structureRowHeight() - bodyLine) / 2 + textBaseline(bodyFont, bodyLine)">S:</text>
                    @for (row of structureRows(); track $index; let rowIndex = $index) {
                        @for (pipState of row; track pipState.index) {
                            <svg class="pip structure" [attr.x]="52.64 + $index * 36.96" [attr.y]="7.84 + (structureRowHeight() - (structureRows().length * 36.96 - gap)) / 2 + rowIndex * 36.96" width="31.36" height="31.36" viewBox="0 0 24 24" [class.damaged]="pipState.isDamaged" [class.pending-damage]="pipState.isPendingDamage" [class.pending-heal]="pipState.isPendingHeal"><circle cx="12" cy="12" r="10" /></svg>
                        }
                    }
                </g>
            </g>
            @if (asStats().usesTh) {
                <g class="thrust-display" [attr.transform]="'translate(' + (leftWidth - padding - 28) + ' ' + ((armorHeight() - 88) / 2) + ')'">
                    <text class="as-caption" y="32" text-anchor="middle">TH:</text><text class="thrust-value" y="79" text-anchor="middle">{{ asStats().Th }}</text>
                </g>
            }
        </g>
        <g class="stats-right" [attr.transform]="'translate(645.4 ' + criticalY() + ')'">
            @if (abilityRuns().length) {
                <g class="pilot-abilities" [attr.transform]="'translate(0 ' + (-abilityRuns().length * 33.6 - gap) + ')'">
                    @for (run of abilityRuns(); track $index) {
                        <text class="pilot-ability" x="5.6" [attr.y]="run.y + textBaseline('700 28px Roboto', 33.6)" (click)="onAbilityClick(run.item)">{{ run.text }}</text>
                    }
                </g>
            }
            @switch (criticalHitsVariant()) {
                @case ('mek') { <g as-critical-hits-mek [width]="rightWidth" [forceUnit]="forceUnit()" [cardStyle]="cardStyle()" [useHex]="useHex()" [interactive]="interactive()" (rollCritical)="onRollCriticalClick()" /> }
                @case ('vehicle') { <g as-critical-hits-vehicle [width]="rightWidth" [forceUnit]="forceUnit()" [cardStyle]="cardStyle()" [useHex]="useHex()" [interactive]="interactive()" (rollCritical)="onRollCriticalClick()" /> }
                @case ('protomek') { <g as-critical-hits-protomek [width]="rightWidth" [forceUnit]="forceUnit()" [cardStyle]="cardStyle()" [useHex]="useHex()" [interactive]="interactive()" (rollCritical)="onRollCriticalClick()" /> }
                @case ('aerofighter') { <g as-critical-hits-aerofighter [width]="rightWidth" [forceUnit]="forceUnit()" [cardStyle]="cardStyle()" [useHex]="useHex()" [interactive]="interactive()" (rollCritical)="onRollCriticalClick()" /> }
                @case ('emplacement') { <g as-critical-hits-emplacement [width]="rightWidth" [forceUnit]="forceUnit()" [cardStyle]="cardStyle()" [useHex]="useHex()" [interactive]="interactive()" (rollCritical)="onRollCriticalClick()" /> }
            }
        </g>
        @if (specialsHeight()) {
            <g class="specials-box" [attr.transform]="'translate(28 ' + specialsY() + ')'">
                <rect class="frame-background" x="1.68" y="1.68" width="1060.64" [attr.height]="specialsHeight() - 3.36" rx="17.92" />
                <text class="as-caption" x="13.44" [attr.y]="7.84 + textBaseline(bodyFont, bodyLine)">SPECIAL:</text>
                @for (run of specialRuns(); track run.item.original) {
                    <text class="special-ability as-value" [attr.x]="run.x" [attr.y]="run.y + 7.84 + textBaseline(valueFont, bodyLine)" [attr.data-original]="run.item.original"
                        [class.exhausted]="run.item.isExhausted || (run.item.maxCount && (run.item.consumedCount ?? 0) >= run.item.maxCount)"
                        [class.has-consumed]="run.item.consumedCount" (click)="onSpecialClick(run.item, $event)">{{ run.item.effective }}@if (run.item.maxCount && run.item.consumedCount) {<tspan class="consumed-indicator">[{{ run.item.maxCount - run.item.consumedCount }}]</tspan>}@if (!$last) {<tspan>,</tspan>}</text>
                }
            </g>
        }
    </g>
    @if (isDestroyed()) {
        <g class="destroyed-overlay screen-only" data-screen-only="true" pointer-events="none">
            <rect width="1120" height="800" fill="#800000" fill-opacity="0.3" />
            <text class="destroyed-text" x="1104.32" y="320" text-anchor="end" transform="rotate(-15 1104.32 320)">DESTROYED</text>
        </g>
    }
</svg>
