<svg viewBox="0 0 1120 800" width="1120" height="800" xmlns="http://www.w3.org/2000/svg">
<g as-vessel-header [unit]="unit()" [forceUnit]="forceUnit()" [cardStyle]="cardStyle()" [skillOverride]="skillOverride()"></g>
<rect x="29.68" y="105.68" width="525.84" height="52.94" rx="16.24" class="frame" />
<g [attr.transform]="'translate(' + statStart() + ' 111.84) scale(' + statScale() + ' 1)'">
    @for (item of statItems(); track item.label) {
        <text [attr.x]="item.x" [attr.y]="statBaseline()" class="caption" [class.clickable]="interactive() && item.label === 'SKILL:'"
            (click)="interactive() && item.label === 'SKILL:' && onEditPilotClick()">{{ item.label }}<tspan dx="1.12" class="value">@for (part of movementParts(item.value); track $index) {<tspan [attr.font-size]="part === '⬢' ? '80%' : null" [attr.baseline-shift]="part === '⬢' ? '30%' : null">{{ part }}</tspan>}</tspan></text>
    }
</g>
@for (item of eraAvailability(); track item.era.id; let i = $index) {
    <image class="era-icon" [class.unavailable]="!item.isAvailable" [attr.href]="item.era.icon" [attr.x]="574 + i * 50.4" y="109.7" width="44.8" height="44.8"><title>{{ item.era.name }}</title></image>
}
<rect x="29.68" [attr.y]="armorY + 1.68" width="525.84" [attr.height]="rowHeight * 2 - 3.36" rx="16.24" class="frame" />
@for (track of ['armor', 'structure']; track track; let i = $index) {
    @let committed = i === 0 ? committedArmorDamage() : committedInternalDamage();
    @let pending = i === 0 ? pendingArmorChange() : pendingInternalChange();
    <g [attr.transform]="'translate(28 ' + (armorY + i * rowHeight) + ')'">
        <text x="87.55" y="29.12" text-anchor="middle" class="section-label">{{ track === 'armor' ? 'ARMOR' : 'STRUCTURE' }}</text>
        <text x="87.55" y="88.35" text-anchor="middle" class="section-value">{{ i === 0 ? armorPips() : structurePips() }}</text>
        <line x1="175.4" y1="7.84" x2="175.4" y2="109.6" stroke="#000" stroke-width="2.24" />
        <text x="186.6" y="29.12" class="section-label">DAMAGE</text>
        <g class="damage-track" [attr.data-damage-track]="track" [class.pending-damage]="pending > 0" [class.pending-heal]="pending < 0">
            <rect x="186.6" y="36.7" width="329.16" height="72.9" fill="transparent" />
            <line x1="186.6" y1="109.6" x2="515.76" y2="109.6" stroke="#000" stroke-width="2.24" />
            @if (committed > 0 || pending > 0) {
                <text x="350" y="93" text-anchor="middle" class="damage-value">{{ committed }}@if (pending !== 0) {<tspan class="pending-value">{{ pending > 0 ? '+' : '' }}{{ pending }}</tspan>}</text>
            }
        </g>
    </g>
}
<rect x="564.48" [attr.y]="armorY + 1.68" width="525.84" height="52.94" rx="16.24" class="frame" />
<text x="827.4" [attr.y]="armorY + 7.84 + statBaseline()" text-anchor="middle" class="caption"><tspan class="value">{{ asStats().Th }}</tspan><tspan dx="5.6">DAMAGE THRESHOLD</tspan></text>
@switch (criticalHitsVariant()) {
    @case ('aerospace-1') {
        <g as-critical-hits-aerospace-1 transform="translate(28 394.3)" [width]="529.2" [height]="309.7" [forceUnit]="forceUnit()" [cardStyle]="cardStyle()" [useHex]="useHex()" [interactive]="interactive()" (rollCritical)="onRollCriticalClick()"></g>
    }
    @case ('dropship-1') {
        <g as-critical-hits-dropship-1 transform="translate(28 394.3)" [width]="529.2" [height]="309.7" [forceUnit]="forceUnit()" [cardStyle]="cardStyle()" [useHex]="useHex()" [interactive]="interactive()" (rollCritical)="onRollCriticalClick()"></g>
    }
}
@if (imageUrl() && !imageLoadFailed()) {
    <image class="fluff-image" [attr.href]="imageUrl()" x="562.8" y="230.86" width="529.2" [attr.height]="imageHeight()" preserveAspectRatio="xMidYMid meet" (error)="onImageError()" />
}
@for (run of pilotRuns(); track $index) {
    <text [attr.x]="run.x" [attr.y]="specialsY() - 10 - (pilotRuns().at(-1)!.y - run.y)" class="pilot-ability" (click)="onAbilityClick(run.item)">{{ run.text }}</text>
}
@if (specials().length) {
    <rect x="564.48" [attr.y]="specialsY() + 1.68" width="525.84" [attr.height]="specialsHeight() - 3.36" rx="16.24" class="frame" />
    <text x="576.24" [attr.y]="specialsY() + 7.84 + specialBaseline()" class="caption">SPECIAL:</text>
    @for (run of specials(); track run.item.original) {
        <text [attr.x]="run.x" [attr.y]="specialsY() + 7.84 + specialBaseline() + run.y" class="value special"
            [attr.textLength]="run.width > 502.32 ? 502.32 : null" lengthAdjust="spacingAndGlyphs"
            [class.exhausted]="run.item.isExhausted || (run.item.maxCount && (run.item.consumedCount ?? 0) >= run.item.maxCount)"
            [attr.data-original]="run.item.original" [class.has-consumed]="run.item.consumedCount"
            (click)="onSpecialClick(run.item, $event)">{{ run.item.effective }}@if (run.item.maxCount && run.item.consumedCount) {<tspan fill="var(--as-red-bright)">[{{ run.item.maxCount - run.item.consumedCount }}]</tspan>}@if (!$last) {<tspan>,</tspan>}</text>
    }
}
@if (isDestroyed()) {
    <g class="screen-only" data-screen-only="true"><rect width="1120" height="800" fill="#800000" opacity=".3" /><text x="640" y="360" class="destroyed" transform="rotate(-15 800 350)">DESTROYED</text></g>
}
</svg>
