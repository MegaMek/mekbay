<svg viewBox="0 0 1120 800" width="1120" height="800" xmlns="http://www.w3.org/2000/svg">
<g as-vessel-header [unit]="unit()" [forceUnit]="forceUnit()" [cardStyle]="cardStyle()" [skillOverride]="skillOverride()" [showPv]="false"></g>
@for (arc of effectiveArcDamageData(); track arc.label; let i = $index) {
    <g [attr.transform]="'translate(' + (26.88 + (i % 2) * 535.92) + ' ' + (87.34 + (i > 1 ? tableHeight() + 5.6 : 0)) + ')'">
        <rect x="1.68" y="1.68" width="526.96" [attr.height]="tableHeight() - 3.36" rx="16.24" class="frame" />
        <text [attr.transform]="'translate(32.4 ' + tableHeight()/2 + ') rotate(-90)'" text-anchor="middle" class="arc-label">{{ arc.label }}</text>
        <g transform="translate(44.8 7.84)">
            @for (col of columns(); track col; let c = $index) {
                <text [attr.x]="columnWidth() * (c + 1.5)" [attr.y]="17.63 + cellBaseline() - 2.24" text-anchor="middle" class="table-header">{{ col }}</text>
            }
            <line x1="0" y1="35.26" x2="472.1" y2="35.26" class="rule" />
            @for (row of rangeRows(); track row.key; let r = $index) {
                @let cy = 35.26 + (r + .5) * rowHeight();
                <text x="11.2" [attr.y]="cy + cellBaseline()" class="range-col">{{ row.label }}</text>
                @for (col of columns(); track col; let c = $index) {
                    <text [attr.x]="columnWidth() * (c + 1.5)" [attr.y]="cy + cellBaseline()" text-anchor="middle" class="damage-cell">{{ arcValue(arc, col, row.key) }}</text>
                }
                <line x1="0" [attr.y1]="35.26 + (r + 1) * rowHeight()" x2="472.1" [attr.y2]="35.26 + (r + 1) * rowHeight()" class="range-rule" />
            }
            @let specialY = 35.26 + 4 * rowHeight();
            <text x="11.2" [attr.y]="specialY + 19.025 + cellBaseline()" class="range-col">SPE</text>
            <text [attr.x]="columnWidth()" [attr.y]="specialY + 19.025 + cellBaseline()" class="damage-cell" [attr.textLength]="arcSpecialWidth(arc.spe ?? '')" lengthAdjust="spacingAndGlyphs">{{ arc.spe ?? '' }}</text>
            <line x1="0" [attr.y1]="specialY + 38.05" x2="472.1" [attr.y2]="specialY + 38.05" class="rule" />
            @let critY = specialY + 38.05 + 20.71;
            <text x="11.2" [attr.y]="critY + cellBaseline()" class="range-col">CRIT</text>
            @for (col of columns(); track col; let c = $index; let last = $last) {
                @let key = arc.shortLabel + '-' + col;
                @let cx = columnWidth() * (c + 1.5);
                <g [attr.data-crit]="key" class="crit-pip-group">
                    <rect [attr.x]="cx - columnWidth()/2" [attr.y]="critY - 18" [attr.width]="columnWidth()" height="36" fill="transparent" />
                    @for (pip of range(4); track pip) {
                        <circle class="pip" [attr.cx]="cx + (pip - 1.5) * 20.16" [attr.cy]="critY" r="8.4" [class.damaged]="isCritPipDamaged(key,pip)" [class.pending-damage]="isCritPipPendingDamage(key,pip)" [class.pending-heal]="isCritPipPendingHeal(key,pip)" />
                    }
                </g>
                @if (!last) { <line [attr.x1]="cx + columnWidth()/2" [attr.y1]="critY - 10.08" [attr.x2]="cx + columnWidth()/2" [attr.y2]="critY + 10.08" class="rule" /> }
            }
        </g>
    </g>
}
<text x="26.88" [attr.y]="87.34 + tableHeight() * 2 + 5.6 + 31.36" class="weapon-note"><tspan class="note-title">WEAPON CRITICALS</tspan><tspan dx="5.6">Damage Value Reduced by 25% per hit. — Randomly determine an appropriate STD/{{ hasCap() ? 'CAP/' : '' }}SCAP/MSL column.</tspan></text>
@if (isDestroyed()) { <rect class="screen-only" data-screen-only="true" width="1120" height="800" fill="#800000" opacity=".3" /> }
</svg>
