@if (hasAutoFall()) {
<span class="unit-notification-badge fall-warning automatic-fall-warning" tabindex="0"
    [attr.role]="interactive() ? 'button' : null"
    [attr.aria-label]="interactive() ? 'Falling: open PSR checks' : 'Automatic fall'"
    [tooltip]="fallTooltip()"
    (click)="activate($event, 'fall')"
    (keydown)="activateFromKeyboard($event, 'fall')">
    <svg viewBox="0 0 16 14" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path class="fall-background"
            d="m15.8 12.2-6.97-11.758a1 1 0 0 0-1.66 0l-7.007 11.858c-0.38 0.6-0.07 1.7 0.68 1.7h14.357c0.7 0 1-1.1 0.6-1.8z" />
        <path class="fall-symbol"
            d="m 10.8,11 c -0.6,-0.1 -1.11,0.1 -1.28,0.6 -0.16,0.4 0,1 0.47,1.2 0.61,0.1 1.11,0 1.31,-0.6 0.2,-0.5 0,-1 -0.5,-1.2 z M 3.61,8.15 5.82,9.38 6.02,9.44 6.31,9.38 7.96,8.56 8.12,10.8 c -0.69,0.5 -2.2,1.1 -2.41,1.3 -0.19,0.1 -0.26,0.4 -0.17,0.5 0.1,0.2 0.49,0.2 0.68,0.1 l 3.29,-1.6 c 0.1,0 0.17,-0.1 0.25,-0.2 l 1.54,-1.68 1.8,0.32 c 0.1,0 0.4,-0.1 0.4,-0.32 0,-0.25 -0.1,-0.44 -0.4,-0.5 L 11.3,8.35 c -0.2,0 -0.4,0.1 -0.5,0.22 L 9.99,9.3 9.77,7.24 C 9.77,7 9.52,6.67 9.36,6.58 L 7.71,5.93 7.63,4.05 C 7.63,3.85 7.39,3.55 7,3.54 6.62,3.53 6.39,3.92 6.39,4.17 l 0.17,2.25 c 0,0.16 0.16,0.33 0.33,0.41 L 7.88,7.24 6.15,8.15 4.18,7.08 C 3.79,6.94 3.51,7.05 3.36,7.34 3.2,7.62 3.36,7.98 3.61,8.15 Z" />
    </svg>
</span>
}

@let notification = pendingNotification();
@if (notification) {
<span class="unit-notification-badge pending-events-warning" tabindex="0"
    [class.fall-warning]="notification.kind === 'fall'"
    [class.psr-warning]="notification.kind === 'psr'"
    [class.critical-chance-warning]="notification.kind === 'critical-chance'"
    [class.critical-hit-warning]="notification.kind === 'critical-hit'"
    [class.unit-check-warning]="notification.kind === 'unit-check'"
    [attr.role]="interactive() ? 'button' : null"
    [attr.aria-label]="pendingNotificationAriaLabel(notification)"
    [tooltip]="notification.tooltip"
    (click)="activate($event, notification.kind)"
    (keydown)="activateFromKeyboard($event, notification.kind)">
    @switch (notification.kind) {
        @case ('fall') {
            <svg viewBox="0 0 16 14" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path class="fall-background"
                    d="m15.8 12.2-6.97-11.758a1 1 0 0 0-1.66 0l-7.007 11.858c-0.38 0.6-0.07 1.7 0.68 1.7h14.357c0.7 0 1-1.1 0.6-1.8z" />
                <path class="fall-symbol"
                    d="m 10.8,11 c -0.6,-0.1 -1.11,0.1 -1.28,0.6 -0.16,0.4 0,1 0.47,1.2 0.61,0.1 1.11,0 1.31,-0.6 0.2,-0.5 0,-1 -0.5,-1.2 z M 3.61,8.15 5.82,9.38 6.02,9.44 6.31,9.38 7.96,8.56 8.12,10.8 c -0.69,0.5 -2.2,1.1 -2.41,1.3 -0.19,0.1 -0.26,0.4 -0.17,0.5 0.1,0.2 0.49,0.2 0.68,0.1 l 3.29,-1.6 c 0.1,0 0.17,-0.1 0.25,-0.2 l 1.54,-1.68 1.8,0.32 c 0.1,0 0.4,-0.1 0.4,-0.32 0,-0.25 -0.1,-0.44 -0.4,-0.5 L 11.3,8.35 c -0.2,0 -0.4,0.1 -0.5,0.22 L 9.99,9.3 9.77,7.24 C 9.77,7 9.52,6.67 9.36,6.58 L 7.71,5.93 7.63,4.05 C 7.63,3.85 7.39,3.55 7,3.54 6.62,3.53 6.39,3.92 6.39,4.17 l 0.17,2.25 c 0,0.16 0.16,0.33 0.33,0.41 L 7.88,7.24 6.15,8.15 4.18,7.08 C 3.79,6.94 3.51,7.05 3.36,7.34 3.2,7.62 3.36,7.98 3.61,8.15 Z" />
            </svg>
            @if (notification.count > 1) {
                <span class="fall-event-count" aria-hidden="true">{{ notification.count }}</span>
            }
        }
        @case ('psr') {
            <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M15.83 13.23l-7-11.76a1 1 0 0 0-1.66 0L.16 13.3c-.38.64-.07 1.7.68 1.7H15.2C15.94 15 16.21 13.87 15.83 13.23Z" />
                <text x="50%" y="55%" text-anchor="middle" dominant-baseline="mathematical">{{ notification.count }}!</text>
            </svg>
        }
        @case ('critical-chance') {
            <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="1" y="1" width="14" height="14" />
                <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle">{{ notification.count }}</text>
            </svg>
        }
        @case ('critical-hit') {
            <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <polygon points="8,.4 9.3,2.3 11.5,1.3 11.8,3.7 14.3,3.7 13.1,5.9 15.6,8 13.1,10.1 14.3,12.3 11.8,12.3 11.5,14.7 9.3,13.7 8,15.6 6.7,13.7 4.5,14.7 4.2,12.3 1.7,12.3 2.9,10.1 .4,8 2.9,5.9 1.7,3.7 4.2,3.7 4.5,1.3 6.7,2.3" />
                <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle">{{ notification.count }}</text>
            </svg>
        }
        @case ('unit-check') {
            <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <polygon points="8,.4 9.3,2.3 11.5,1.3 11.8,3.7 14.3,3.7 13.1,5.9 15.6,8 13.1,10.1 14.3,12.3 11.8,12.3 11.5,14.7 9.3,13.7 8,15.6 6.7,13.7 4.5,14.7 4.2,12.3 1.7,12.3 2.9,10.1 .4,8 2.9,5.9 1.7,3.7 4.2,3.7 4.5,1.3 6.7,2.3" />
                <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle">{{ notification.count }}</text>
            </svg>
        }
    }
</span>
}
