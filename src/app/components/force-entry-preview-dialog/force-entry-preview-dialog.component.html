<div class="wide-dialog">
    <div class="wide-dialog-body">
        <force-preview-panel [force]="force" [displayMode]="displayMode" [scrollUnitsOnly]="true"></force-preview-panel>
    </div>
    <div class="wide-dialog-actions">
        @if (isForceLoaded()) {
            <button class="bt-button" (click)="onRecall()" [disabled]="busy()">RECALL</button>
        } @else {
            <button class="bt-button primary" (click)="onDeploy()" [disabled]="busy()">DEPLOY</button>
        }
        <button class="bt-button" (click)="close()">DISMISS</button>
    </div>
</div>
