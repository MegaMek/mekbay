<!-- Card Tab Content -->
<div #viewport class="tab-content">
    <div #cards class="cards">
        @for (cardIndex of cardIndices(); track cardIndex) {
            <alpha-strike-card
                [unit]="unit()"
                [fluffImageUrl]="fluffImageUrl()"
                [useHex]="useHex()"
                [cardIndex]="cardIndex"
                [cardStyle]="cardStyle()"
                class="alpha-strike-card-panel">
            </alpha-strike-card>
        }
    </div>
</div>
