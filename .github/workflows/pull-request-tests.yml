name: Pull Request Tests
run-name: Validate PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    branches:
      - main
      - next

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-suite:
    name: Test suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get latest code
        uses: actions/checkout@v5

      - name: Checkout mm-data
        uses: actions/checkout@v5
        with:
          repository: MegaMek/mm-data
          path: mm-data
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate metadata
        env:
          MM_DATA_PATH: mm-data
        run: npm run gen-meta

      - name: Generate sprites
        env:
          MM_DATA_PATH: mm-data
        run: npm run gen-sprites

      - name: Generate assets
        env:
          MM_DATA_PATH: mm-data
        run: npm run gen-assets

      - name: Verify deterministic asset and deployment pipelines
        run: npm run check:asset-pipeline && npm run test:deploy-pipeline

      - name: Verify script typechecks
        run: npm run typecheck:scripts

      - name: Verify entity/runtime architecture boundaries
        run: npm run test:convergence-architecture && npm run test:equipment-status-architecture && npm run typecheck:equipment-status-profile

      - name: Run Angular test suite
        env:
          MM_DATA_PATH: mm-data
        run: npm test -- --watch=false --browsers ChromeHeadless

      # Assets were generated above; invoke the production target directly so
      # the expensive mm-data and sprite generation is not repeated.
      - name: Build production application
        run: npm exec -- ng build --configuration=production
